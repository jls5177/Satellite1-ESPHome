api:
  id: api_id
  actions:
    - action: announce
      variables:
        message: string
        chime: bool
        follow_up: string
      then:
        - lambda: id(va).send_announce_text(message, chime, follow_up);
  on_client_connected:
    - script.execute: control_leds
    - script.execute: start_realtime_wake_word
  on_client_disconnected:
    - script.execute: control_leds
  encryption:   # Uses key set by Home Assistant

button:
  # Restarts Sat1 Device
  - platform: restart
    name: "Restart Sat1"
    entity_category: diagnostic

  # Restores the Sat1 ESP back to factory settings
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset ESP32 FW"
    entity_category: diagnostic
    internal: true

switch:
  # Wake Word Sound Switch.
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

    # This is the master mute switch. It is exposed to Home Assistant. The user can only turn it on and off if the hardware switch is off. (The hardware switch overrides the software one)
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:microphone-off"
    name: Mute Microphones
    entity_category: config
    turn_on_action:
      - if:
          condition:
            binary_sensor.is_off: btn_left
          then:
            - switch.template.publish:
                id: master_mute_switch
                state: ON
    turn_off_action:
      - if:
          condition:
            binary_sensor.is_off: btn_left
          then:
            - switch.template.publish:
                id: master_mute_switch
                state: OFF
          else:
            - lambda: id(warning) = true;
            - script.execute: control_leds
    on_turn_on:
      - microphone.mute: sat1_mics
      - if:
          condition:
            lambda: |-
              return (id(voice_assistant_phase) != ${voice_assist_idle_phase_id} &&
                      id(voice_assistant_phase) != ${voice_assist_not_ready_phase_id}) ||
                     id(followup_window_open);
          then:
            - lambda: id(va).send_interrupt();
            - speaker.stop: assistant_resampling_speaker
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - lambda: id(followup_window_open) = false;
      - lambda: id(followup_requested) = false;
      - script.stop: followup_window_watchdog
      - micro_wake_word.disable_model: stop
      - script.execute: reconcile_ducking
      - script.execute: control_leds
    on_turn_off:
      - microphone.unmute: sat1_mics
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - lambda: id(stop).set_probability_cutoff(102);
      - script.execute: control_leds

text_sensor:
  - platform: template
    id: pd_state_text
    name: "USB-C Power Supply"
    icon: "mdi:usb-c-port"
    entity_category: "diagnostic"
    update_interval: never
    lambda: |-
      if( id(pd_fusb302b).state == power_delivery::PD_STATE_DISCONNECTED){
        return std::string("Detached");
      } else {
        return id(pd_fusb302b).contract;
      }

  - platform: template
    id: xmos_firmware_version_text
    name: "XMOS Firmware"
    icon: "mdi:memory"
    entity_category: "diagnostic"
    update_interval: never
    lambda: return id(satellite1_id).status_string();
