button:
  - platform: template
    name: Stop Timer Ringing
    icon: mdi:timer-off
    on_press:
      - switch.turn_off: timer_ringing

switch:
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - micro_wake_word.enable_model: stop
      - lambda: id(stop).set_probability_cutoff(102);
      - script.execute: reconcile_ducking
      - script.execute: ring_timer
      - script.execute: control_leds
      - script.execute: timer_ring_watchdog
    on_turn_off:
      - script.stop: timer_ring_watchdog
      - lambda: id(va).stop_ringing();
      - script.execute: disable_timer_repeat
      - if:
          condition:
            media_player.is_announcing:
              id: external_media_player
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - if:
          condition:
            lambda: |-
              return id(followup_window_open) ||
                     id(voice_assistant_phase) == ${voice_assist_replying_phase_id} ||
                     (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id} &&
                      id(va).turn_has_reply_audio());
          then:
            - micro_wake_word.enable_model: stop
            - lambda: 'id(stop).set_probability_cutoff(id(followup_window_open) ? 102 : 128);'
          else:
            - micro_wake_word.disable_model: stop
      - script.execute: reconcile_ducking
      - script.execute: control_leds

script:
  - id: ring_timer
    then:
      - script.execute: enable_timer_repeat
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  - id: enable_timer_repeat
    then:
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms

  - id: disable_timer_repeat
    then:
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms

  - id: timer_ring_watchdog
    mode: restart
    then:
      - delay: 15min
      - switch.turn_off: timer_ringing
